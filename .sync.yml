---
:global:
  python_min_version: "3.11"
  python_supported_versions: ["3.11", "3.12", "3.13", "3.14"]
  module_rootname: "django_scrubber"
  module_description: "Data anonymizer for Django"
  module_keywords:
    ["django", "data protection", "scrubber", "scrub", "anonymize", "gdpr"]
  dependencies: ["Faker>=20.0.0", "Django>=5.2,<6.2"]
  max_line_length: 119
  changelog_since_tag: "v4.1.0"

.devcontainer/devcontainer.json:
  run_services: ["app", "mysql", "postgres"]

compose.yaml:
  require_mysql: true
  require_postgres: true
